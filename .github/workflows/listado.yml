name: Generar pag.txt

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-listado:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Generar pag.txt
        run: |
          find . -type f \( -name "*.html" -o -name "*.md" \) \
            | sed 's|^\./||' \
            | sort \
            | awk '{print "https://guarduino.github.io/Docs/" $0}' \
            > pag.txt

      - name: Confirmar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pag.txt

          if git diff --cached --quiet; then
            echo "Sin cambios en pag.txt"
          else
            git commit -m "Actualizar pag.txt"
            git push
          fi
          
